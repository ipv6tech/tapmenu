name: tapmenu

services:
  tapmenu:
    build: .
    container_name: tapmenu
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - tapmenu-data:/data
    environment:
      - PORT=3000
      - SESSION_SECRET=change-me-to-a-long-random-string
      # Optional: set DB path (default is /data/taproom.db)
      # - DB_PATH=/data/taproom.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tapmenu-data:
    # Pinned to the pre-existing volume name so renaming the service doesn't
    # orphan the data from the previous "taproom" container.
    name: app_taproom-data
    driver: local

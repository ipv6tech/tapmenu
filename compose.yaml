name: tapmenu

services:
  tapmenu:
    build: .
    image: tapmenu:${TAPMENU_VERSION:-latest}
    container_name: tapmenu
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - tapmenu-data:/data
    environment:
      - PORT=3000
      # Optional: set a long random value. If unset, a secret is generated and stored in the data volume.
      # - SESSION_SECRET=
      # Behind an HTTPS reverse proxy, enable these so the session cookie is marked Secure:
      # - TRUST_PROXY=true
      # - COOKIE_SECURE=true
      # Optional: set DB path (default is /data/taproom.db)
      # - DB_PATH=/data/taproom.db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  tapmenu-data:
    # Pinned to the pre-existing volume name so renaming the service doesn't
    # orphan the data from the previous "taproom" container.
    name: app_taproom-data
    driver: local
